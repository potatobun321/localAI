<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniCPM Local Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --thought-bg: #1e1e2f;
      --thought-border: #475569;
      --thought-text: #a5b4fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #3b82f6;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .badge.fast {
      background: #14532d;
      color: #86efac;
      border-color: #22c55e;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button.btn-subtle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.btn-subtle:hover {
      background: var(--border);
      color: var(--text);
    }
    main#chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 90%;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #eff6ff;
      padding: 10px 16px;
      border-radius: 16px 16px 2px 16px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 16px 16px 16px 2px;
    }
    .thought-block {
      background: var(--thought-bg);
      border: 1px solid var(--thought-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      color: var(--thought-text);
      font-style: italic;
    }
    .thought-title {
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: var(--primary);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.9s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-form {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea#prompt-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.95rem;
      resize: none;
      height: 48px;
      line-height: 1.4;
      outline: none;
      transition: border 0.2s;
    }
    textarea#prompt-input:focus {
      border-color: var(--primary);
    }
    button#send-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#send-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    button#send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>MiniCPM5-1B</span>
      <span id="mode-badge" class="badge" title="Click to toggle mode">Thinking Mode</span>
    </div>
    <div class="actions">
      <button class="btn-subtle" id="clear-btn">Clear History</button>
    </div>
  </header>

  <main id="chat-container">
    <div class="message assistant" id="welcome-msg">
      Hello! I am your local MiniCPM assistant. How can I help you today?
    </div>
  </main>

  <footer>
    <form class="input-form" id="chat-form">
      <textarea id="prompt-input" placeholder="Type your message..." rows="1"></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
    <div class="hint">Enter to send • Shift+Enter for new line • Zero-dependency microserver</div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const promptInput = document.getElementById('prompt-input');
    const chatForm = document.getElementById('chat-form');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const modeBadge = document.getElementById('mode-badge');

    let thinkingMode = true;

    // Fetch initial status
    fetch('/api/status')
      .then(r => r.json())
      .then(data => {
        thinkingMode = data.thinking_mode;
        updateModeBadge();
      })
      .catch(() => {});

    function updateModeBadge() {
      if (thinkingMode) {
        modeBadge.textContent = 'Thinking Mode';
        modeBadge.className = 'badge';
      } else {
        modeBadge.textContent = 'Fast Mode';
        modeBadge.className = 'badge fast';
      }
    }

    modeBadge.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/mode', { method: 'POST' });
        const data = await res.json();
        thinkingMode = data.thinking_mode;
        updateModeBadge();
      } catch (err) {
        console.error(err);
      }
    });

    clearBtn.addEventListener('click', async () => {
      await fetch('/api/clear', { method: 'POST' });
      chatContainer.innerHTML = '<div class="message assistant">Conversation history cleared.</div>';
    });

    // Auto-expand textarea
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + 'px';
    });

    // Enter key handler
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    function renderContent(rawText) {
      if (!rawText.includes('<think>') && !rawText.includes('</think>')) {
        return document.createTextNode(rawText);
      }
      const container = document.createElement('div');
      if (rawText.includes('<think>')) {
        const parts = rawText.split('</think>');
        const thoughtText = parts[0].replace('<think>', '').trim();
        const mainText = (parts[1] || '').trim();

        if (thoughtText) {
          const thoughtDiv = document.createElement('div');
          thoughtDiv.className = 'thought-block';
          thoughtDiv.innerHTML = '<div class="thought-title">Thought Process</div>' + escapeHtml(thoughtText);
          container.appendChild(thoughtDiv);
        }
        if (mainText) {
          const bodyDiv = document.createElement('div');
          bodyDiv.textContent = mainText;
          container.appendChild(bodyDiv);
        }
      }
      return container;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      // Append user message
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = prompt;
      chatContainer.appendChild(userMsg);

      promptInput.value = '';
      promptInput.style.height = '48px';
      sendBtn.disabled = true;

      // Append assistant message placeholder
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      const contentSpan = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      assistantMsg.appendChild(contentSpan);
      assistantMsg.appendChild(cursor);
      chatContainer.appendChild(assistantMsg);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      let accumulated = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // keep remainder

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const payload = JSON.parse(line.slice(6));
                if (payload.text) {
                  accumulated += payload.text;
                  contentSpan.innerHTML = '';
                  contentSpan.appendChild(renderContent(accumulated));
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (parseErr) {
                console.error(parseErr);
              }
            }
          }
        }
      } catch (err) {
        contentSpan.textContent = 'Error: ' + err.message;
      } finally {
        cursor.remove();
        sendBtn.disabled = false;
        promptInput.focus();
      }
    });
  </script>
</body>
</html>
